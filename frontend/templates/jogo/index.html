<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reinos de Aerion</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <main class="tela-jogo">

        <header class="cabecalho-jogo">

            <h1>Reinos de Aerion</h1>

        </header>


        <section class="painel-jogador">

            <div class="informacoes-personagem">

                <h2>{{ jogador.nome }}</h2>

                <p>Classe: {{ jogador.classe }}</p>
                <p>Nível: {{ jogador.nivel }}</p>
                <p>Ouro: {{ jogador.ouro }}</p>

            </div>


            <div class="status-personagem">

                <h2>Status</h2>

                <div class="barra-status">

                    <div class="status-cabecalho">

                        <span>Vida</span>

                        <span>
                            {{ jogador.vida }}/{{ jogador.vida_maxima }}
                        </span>

                    </div>

                    <div class="barra">

                        <div
                            class="barra-preenchimento vida"
                            style="width: {{ jogador.vida_porcentagem }}%;"
                        ></div>

                    </div>

                </div>


                <div class="barra-status">

                    <div class="status-cabecalho">

                        <span>Mana</span>

                        <span>
                            {{ jogador.mana }}/{{ jogador.mana_maxima }}
                        </span>

                    </div>

                    <div class="barra">

                        <div
                            class="barra-preenchimento mana"
                            style="width: {{ jogador.mana_porcentagem }}%;"
                        ></div>

                    </div>

                </div>

            </div>

        </section>


        <section class="area-mundo">

            <h2>Vila Inicial</h2>

            <p>
                Você está na vila inicial de Aerion.
            </p>

        </section>


        <nav class="menu-jogo">

            <button>Personagem</button>
            <button>Inventário</button>
            <button>Habilidades</button>
            <button>Quests</button>
            <button>Mapa</button>

        </nav>


    </main>

</body>

</html>
